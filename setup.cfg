[metadata]
name = accuknox-aspm-scanner
version = 0.16.4
description = AccuKnox ASPM Scanner
author = AccuKnox
author_email = accuknox@accuknox.com

[options]
python_requires = >=3.9
install_requires =
    pydantic==2.13.4
    colorama==0.4.6
    requests==2.32.3
    async-timeout==5.0.1
    pre-commit==4.3.0
    pyyaml==6.0.3
    accuknox-sq-sast @ https://github.com/accuknox/aspm-sastjob/releases/download/2.0.3/accuknox_sq_sast-0.1.1-py3-none-any.whl
packages = find:
include_package_data = True

[options.package_data]
aspm_cli.certin = cert_in_rules.json

[options.entry_points]
console_scripts =
    accuknox-aspm-scanner = aspm_cli.cli:main
