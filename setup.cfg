[metadata]
name = accuknox-aspm-scanner
version = 0.14.7-rc.3
description = AccuKnox ASPM Scanner
author = AccuKnox
author_email = accuknox@accuknox.com

[options]
python_requires = >=3.9
install_requires =
    pydantic==2.13.4
    colorama==0.4.6
    requests==2.32.3
    async-timeout==5.0.1
    pre-commit==4.3.0
packages = find:

[options.extras_require]
# accuknox-sq-sast pins aiohttp==3.11.18, which has no cp314 wheel -- kept
# out of install_requires so the base scanner installs on Python 3.14. Only
# the sq-sast scan type needs this; see aspm_cli/scan/sq_sast.py.
sq-sast =
    accuknox-sq-sast @ https://github.com/accuknox/aspm-sastjob/releases/download/2.0.0/accuknox_sq_sast-0.1.0-py3-none-any.whl

[options.entry_points]
console_scripts =
    accuknox-aspm-scanner = aspm_cli.cli:main
