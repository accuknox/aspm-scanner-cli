name: Test Binary Build (Linux + Windows)

# Manual / branch-push pre-production build of the Linux and Windows binaries as downloadable
# workflow artifacts. No tags, no GitHub Release - entirely
# separate from release.yml (the real release pipeline shared with
# upstream), so a test build here can never touch it.

on:
  workflow_dispatch: {}
  push:
    branches: [feat/pr-decorator-quality-gates, next]

jobs:
  build-linux-binary:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Linux executable (Debian 11 / glibc 2.31)
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            python:3.10-bullseye \
            bash -euo pipefail -c '
              python -m pip install --upgrade pip pipenv
              pipenv install
              pipenv run pip install pyinstaller
              pipenv run pyinstaller accuknox-aspm-scanner.spec
            '

      - name: Test Binary
        run: ./dist/accuknox-aspm-scanner --help

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: accuknox-aspm-scanner-linux-amd64
          retention-days: 7
          path: dist/accuknox-aspm-scanner

  build-windows-binary:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Windows executable
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install
          pipenv run pip install pyinstaller
          pipenv run pyinstaller accuknox-aspm-scanner.spec

      - name: Test Binary
        run: ./dist/accuknox-aspm-scanner.exe --help

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: accuknox-aspm-scanner-windows-amd64
          retention-days: 7
          path: dist/accuknox-aspm-scanner.exe
