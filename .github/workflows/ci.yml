name: CI

# Runs the tests and checks that the built package installs and starts, on every pull request and on
# pushes to main and release branches. Python 3.9 is the oldest version setup.cfg supports; 3.12 is
# the version the release binaries are built with.
on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: newer Ubuntu runner images no longer provide Python 3.9
        os: [ubuntu-22.04, windows-latest]
        python: ['3.9', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and pytest
        run: python -m pip install . pytest

      - name: Run the tests
        run: python -m pytest -q tests

      # Catches anything that only breaks once installed, such as syntax a supported Python version
      # cannot load: build the wheel, install it into a clean environment and start the CLI.
      - name: Build the wheel and start the installed CLI
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv smoke
          if [ -d smoke/Scripts ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          "$bin/python" -m pip install dist/*.whl
          for args in "--version" "--help" "scan --help" "pipeline --help" "gate --help" "tool --help"; do
            echo "::group::accuknox-aspm-scanner $args"
            "$bin/accuknox-aspm-scanner" $args
            echo "::endgroup::"
          done
