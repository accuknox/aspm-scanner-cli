name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Rebuild and replace assets on an existing tag (no version bump).
  # Use this to refresh v0.14.7 native binaries in place.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing GitHub release tag to update (e.g. v0.14.7)'
        required: true
        default: 'v0.14.7'

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tool
        run: pip install build

      - name: Build source + wheel
        run: python -m build

      - name: Create GitHub Release and Upload Python Artifacts
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.whl
          draft: false
          prerelease: false

  build-pyinstaller:
    needs: release
    strategy:
      matrix:
        include:
          # Linux native binary is built in Debian 11 (glibc 2.31) so it also runs on
          # Amazon Linux 2023 / RHEL 9 (2.34). Building on Ubuntu 22.04 (glibc 2.35)
          # caused GLIBC_2.35 not found on those hosts. Newer glibc can run older
          # binaries; the reverse is not true.
          #
          # Each OS must upload a unique GitHub Release asset name. Linux and macOS
          # previously both uploaded `accuknox-aspm-scanner`; the last job won, so
          # Linux hosts downloaded a Mach-O binary (Exec format error).
          - os: ubuntu-22.04
            name: linux
            suffix: ''
            ext: ''
            asset: accuknox-aspm-scanner-linux-amd64
            # Jenkins / existing docs curl this unprefixed name; Linux-only.
            compat_asset: accuknox-aspm-scanner
          - os: windows-latest
            name: windows
            suffix: '.exe'
            ext: '.exe'
            asset: accuknox-aspm-scanner-windows-amd64.exe
            compat_asset: accuknox-aspm-scanner.exe
          - os: macos-14
            name: macos
            suffix: ''
            ext: ''
            asset: accuknox-aspm-scanner-darwin-arm64
            compat_asset: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    env:
      PYTHON_VERSION: "3.10"

    continue-on-error: true

    outputs:
      ubuntu_done: ${{ steps.set-output-ubuntu.outputs.ready || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.name != 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pipenv
        if: matrix.name != 'linux'
        run: |
          python -m pip install pipenv

      - name: Install deps and run pyinstaller
        if: matrix.name != 'linux'
        run: |
          python3 -m pipenv install
          python3 -m pipenv run pip install pyinstaller

      - name: Build executable
        if: matrix.name != 'linux'
        run: python3 -m pipenv run pyinstaller accuknox-aspm-scanner.spec

      - name: Build Linux executable (Debian 11 / glibc 2.31)
        if: matrix.name == 'linux'
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            python:3.10-bullseye \
            bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends git
              python -m pip install --upgrade pip pipenv
              pipenv install
              pipenv run pip install pyinstaller
              pipenv run pyinstaller accuknox-aspm-scanner.spec
            '

      - name: Test Binary
        shell: bash
        run: |
          ./dist/accuknox-aspm-scanner${{ matrix.ext }} --help

      - name: Verify Linux binary glibc requirement
        if: matrix.name == 'linux'
        run: |
          echo "GLIBC symbols required by native binary:"
          objdump -T dist/accuknox-aspm-scanner | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee /tmp/glibc-syms.txt
          if grep -E '^GLIBC_2\.(3[2-9]|[4-9][0-9]*)' /tmp/glibc-syms.txt; then
            echo "Binary requires glibc newer than 2.31 (would fail on Amazon Linux 2023 / RHEL 9)"
            exit 1
          fi

      - name: Stage uniquely named release assets
        shell: bash
        run: |
          mkdir -p release-assets
          src="dist/accuknox-aspm-scanner${{ matrix.ext }}"
          cp "$src" "release-assets/${{ matrix.asset }}"
          if [ -n "${{ matrix.compat_asset }}" ]; then
            cp "$src" "release-assets/${{ matrix.compat_asset }}"
          fi
          if [ "${{ matrix.name }}" = "macos" ] && [ -e release-assets/accuknox-aspm-scanner ]; then
            echo "macOS must not upload the unprefixed accuknox-aspm-scanner asset"
            exit 1
          fi
          ls -lh release-assets

      - name: Upload Native Binary to the Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*

      - name: Upload Ubuntu Native Binary Artifact
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: native-binary-linux
          retention-days: 1
          path: dist/accuknox-aspm-scanner

      - name: Flag Ubuntu completion
        if: matrix.os == 'ubuntu-22.04'
        id: set-output-ubuntu
        run: echo "ready=true" >> $GITHUB_OUTPUT

  build-deb:
    needs: [ release, build-pyinstaller ]
    if: needs.build-pyinstaller.outputs.ubuntu_done == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PYTHON_VERSION: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Ubuntu Native Binary
        uses: actions/download-artifact@v5
        with:
          name: native-binary-linux
          path: utils/package/tools
    
      - name: Prepare ASPM DEB and Scanners for Linux
        shell: bash
        run: |
          cd utils
          chmod +x ./prepare-aspm-scanners.sh
          ./prepare-aspm-scanners.sh
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper

          cd package
          curl -sfL https://knoxctl-cli.s3.us-east-2.amazonaws.com/install.sh | sh -s -- -b $PWD/tools
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          dpkg-buildpackage -us -uc -b

          ls -lahR ../../
          cd ../../

      - name: Upload Scanner Tarballs to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            utils/*.tar.gz

      - name: Upload ASPM DEB and Scanners for Linux
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            utils/*.deb

  build-darwin-scanners:
    needs: [ release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Darwin scanner tarballs (arm64 + x86_64)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          cd utils
          chmod +x ./prepare-aspm-scanners-darwin.sh
          ./prepare-aspm-scanners-darwin.sh

      - name: Upload Darwin Scanner Tarballs to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            utils/*-darwin-*.tar.gz

  build-windows-scanners:
    needs: [ release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Windows scanner tarballs (amd64)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          cd utils
          chmod +x ./prepare-aspm-scanners-windows.sh
          ./prepare-aspm-scanners-windows.sh

      - name: Upload Windows Scanner Tarballs to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            utils/*-windows-*.tar.gz
